# Refreshes the live figures on the site every two hours and whenever main
# changes. Files are rewritten only when a figure has changed, so a quiet
# period produces no commits. Runs inside the free allowance for public
# repositories.
name: Refresh site data

on:
  schedule:
    - cron: "0 */2 * * *"     # every two hours, on the hour (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

# one run at a time, so a scheduled run and a push cannot both push to main
concurrency:
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # a full history, so the commit step can rebase before it pushes
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch counts and the contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: Qasim-Hussain-Code
          HF_USER: QasimHussain
        run: node scripts/refresh.mjs

      - name: Commit any change
        run: |
          git config user.name  "Qasim Hussain"
          git config user.email "211460495+Qasim-Hussain-Code@users.noreply.github.com"
          git add data/activity.json data/profile.json
          git diff --staged --quiet && exit 0
          git commit -m "refresh_data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

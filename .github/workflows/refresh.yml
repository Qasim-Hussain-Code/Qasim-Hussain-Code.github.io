# Refreshes the live figures on the site once a day and whenever main changes.
# Runs inside the free allowance for public repositories.
name: Refresh site data

on:
  schedule:
    - cron: "0 22 * * *"      # 06:00 Taipei
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch counts and the contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: Qasim-Hussain-Code
          HF_USER: QasimHussain
        run: node scripts/refresh.mjs

      - name: Commit any change
        run: |
          git config user.name  "Qasim Hussain"
          git config user.email "211460495+Qasim-Hussain-Code@users.noreply.github.com"
          git add data/activity.json data/profile.json
          git diff --staged --quiet || git commit -m "refresh_data"
          git push
